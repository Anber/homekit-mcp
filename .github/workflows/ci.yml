name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homekit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    name: Security, background lifecycle and native build
    # GitHub's arm64 pool can fail before allocating a runner. Build a universal
    # app on the Intel pool; production/fixture code is unchanged.
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Production core and local transport tests (no HomeKit)
        run: make test
      - name: Build actual Mac Catalyst application without signing or execution
        run: make build-unsigned
